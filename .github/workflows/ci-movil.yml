# Integración continua de la app móvil (.NET MAUI, Android): pruebas de su lógica y compilación del APK.
# Va aparte de ci.yml porque necesita Windows y la carga de trabajo maui-android. Solo se ejecuta cuando
# cambian la app, los contratos que comparte con el servidor o este flujo: en un repositorio privado,
# los minutos de Windows cuentan el doble de la cuota gratuita de GitHub Actions.
name: CI app móvil

on:
  pull_request:
    branches: [main]
    paths:
      - "src/Cad.Movil/**"
      - "src/Cad.Contratos/**"
      - "tests/Cad.Movil.Tests/**"
      - "CadMovil.slnx"
      - "global.json"
      - ".github/workflows/ci-movil.yml"
  push:
    branches: [main]
    paths:
      - "src/Cad.Movil/**"
      - "src/Cad.Contratos/**"
      - "tests/Cad.Movil.Tests/**"
      - "CadMovil.slnx"
      - "global.json"
      - ".github/workflows/ci-movil.yml"

permissions:
  contents: read

jobs:
  app:
    name: Pruebas y compilación de Android
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"
      - run: dotnet workload install maui-android
      # Instala la plataforma de Android que pide el proyecto si la imagen del ejecutor no la trae.
      - run: dotnet build src/Cad.Movil/Cad.Movil.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$env:ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
      - run: dotnet test tests/Cad.Movil.Tests/Cad.Movil.Tests.csproj -c Release --logger "console;verbosity=normal"
      - run: dotnet build src/Cad.Movil/Cad.Movil.csproj -c Release -f net10.0-android -p:AndroidSdkDirectory="$env:ANDROID_HOME"
