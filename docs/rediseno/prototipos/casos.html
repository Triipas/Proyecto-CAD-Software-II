<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Casos · Prototipo CAD v2</title>
  <link rel="stylesheet" href="../../../src/Cad.Server/wwwroot/css/tokens.css" />
  <link rel="stylesheet" href="prototipo.css" />
  <style>
    .encabezado { display: flex; align-items: end; gap: var(--espacio-4); flex-wrap: wrap; }
    .encabezado p { color: var(--color-texto-secundario); font-size: var(--texto-sm); }
    .filtros { display: grid; gap: var(--espacio-3); padding: var(--espacio-4); }
    .filtros__fila { display: flex; gap: var(--espacio-2); flex-wrap: wrap; align-items: center; }
    .filtro-activo { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 6px 0 12px; border-radius: var(--radio-pildora); background: var(--color-tenue); color: var(--color-informacion); font-size: var(--texto-sm); font-weight: var(--peso-semi); }
    .filtro-activo button { width: 24px; height: 24px; border: 0; border-radius: 99px; background: transparent; color: inherit; cursor: pointer; display: grid; place-items: center; }
    .filtro-activo button:hover { background: var(--color-tenue-fuerte); }
    .panel-filtros { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--espacio-3); padding-top: var(--espacio-3); border-top: 1px solid var(--color-borde); }
    .resumen { display: flex; justify-content: space-between; align-items: center; padding: var(--espacio-3) var(--espacio-4); font-size: var(--texto-sm); color: var(--color-texto-secundario); }
    .origen { display: inline-flex; align-items: center; gap: 6px; font-weight: var(--peso-semi); }
    .tiempos-celda { display: grid; font-size: var(--texto-xs); color: var(--color-texto-secundario); text-align: right; }
    .tiempos-celda b { font-size: var(--texto-sm); color: var(--color-texto); }
    .vacio-tabla { padding: var(--espacio-12) var(--espacio-4); text-align: center; display: grid; gap: var(--espacio-2); justify-items: center; color: var(--color-texto-secundario); }
    .vacio-tabla b { color: var(--color-texto); font-size: var(--texto-lg); }
  </style>
</head>
<body>
  <div id="barra"></div>
  <main class="pagina">
    <div class="encabezado">
      <div><h1 class="titulo-pagina">Casos</h1><p>SOS y reportes, los más recientes primero.</p></div>
    </div>

    <section class="superficie filtros" aria-label="Filtros">
      <div class="filtros__fila">
        <button class="boton boton--secundario boton--compacto" type="button" aria-expanded="false" aria-controls="panel-filtros" data-abrir-filtros><svg class="icono icono--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></svg>Filtros</button>
        <span id="activos" class="filtros__fila"></span>
        <button class="boton boton--terciario boton--compacto" type="button" data-limpiar style="margin-left:auto">Limpiar filtros</button>
      </div>
      <div class="panel-filtros" id="panel-filtros" hidden>
        <div class="campo"><label class="campo__etiqueta" for="desde">Desde</label><input class="campo__control" type="date" id="desde" value="2026-10-17" /></div>
        <div class="campo"><label class="campo__etiqueta" for="hasta">Hasta</label><input class="campo__control" type="date" id="hasta" value="2026-10-18" /></div>
        <div class="campo"><label class="campo__etiqueta" for="origen">Origen</label><select class="campo__control" id="origen"><option value="">Todos</option><option>SOS</option><option>Reporte</option><option>Acompañamiento</option></select></div>
        <div class="campo"><label class="campo__etiqueta" for="estado">Estado</label><select class="campo__control" id="estado"><option value="">Todos</option><option>Pendiente</option><option>En revisión</option><option>Cerrada</option><option>Derivada</option><option>Descartada</option><option>Cancelada</option></select></div>
        <div class="campo"><label class="campo__etiqueta" for="sereno">Sereno asignado</label><select class="campo__control" id="sereno"><option value="">Todos</option><option>Sara Serena Ficticia</option></select></div>
      </div>
    </section>

    <section class="superficie" aria-labelledby="titulo-resultados">
      <div class="resumen"><h2 id="titulo-resultados" style="font-size:var(--texto-sm);font-weight:var(--peso-medio);color:var(--color-texto)"><span id="cuenta"></span></h2><span>Página 1 de 1</span></div>
      <div class="tabla-contenedor" tabindex="0" role="region" aria-labelledby="titulo-resultados">
        <table class="tabla">
          <thead><tr><th scope="col">Registrado</th><th scope="col">Origen</th><th scope="col">Estado</th><th scope="col">Tipo</th><th scope="col">Personas</th><th scope="col">Ubicación</th><th scope="col" class="num">Tiempos</th><th scope="col"><span class="visualmente-oculto">Acciones</span></th></tr></thead>
          <tbody id="filas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="controles-prototipo" role="group" aria-label="Controles del prototipo">
    <b>Prototipo</b><button type="button" data-vacio aria-pressed="false">Sin resultados</button><a href="central.html">Central</a><a href="index.html">Índice</a>
  </div>

  <script type="module">
    import { barra, icono } from './prototipo.js';
    document.getElementById('barra').innerHTML = barra('casos', { sos: 1, porAsignar: 1, serenos: '3/5', acompanamientos: 2 });

    const T = { Pendiente: ['urgente', 'reloj'], 'En revisión': ['informacion', 'lupa'], Recibido: ['informacion', 'bandeja'], Cerrada: ['exito', 'exito'], Derivada: ['neutro', 'derivar'], Descartada: ['neutro', 'error'], Cancelada: ['neutro', 'cancelar'], 'Por asignar': ['advertencia', 'reloj'] };
    const CASOS = [
      ['18/10/2026', '00:10', 'SOS', 'Pendiente', 'Por determinar', 'Ana Ficticia', '—', 'Del dispositivo', null, null],
      ['18/10/2026', '00:09', 'Acompañamiento', 'Pendiente', 'Por determinar', 'Beto Ficticio', '—', 'Última posición del acompañamiento', null, null],
      ['17/10/2026', '23:59', 'SOS', 'Cancelada', 'Por determinar', 'Ana Ficticia', '—', 'Del dispositivo', null, null],
      ['17/10/2026', '23:55', 'Reporte', 'Descartada', 'Violencia doméstica', 'Ana Ficticia', '—', 'Sin ubicación', '1 min 01 s', null],
      ['17/10/2026', '23:54', 'Reporte', 'Derivada', 'Actividad relacionada con drogas', 'Ana Ficticia', '—', 'Lugar del hecho', '1 min 58 s', null],
      ['17/10/2026', '23:53', 'Reporte', 'Cerrada', 'Robo', 'Ana Ficticia', 'Sara Serena Ficticia', 'Lugar del hecho', '3 min 44 s', '5 min 35 s'],
      ['17/10/2026', '23:43', 'SOS', 'Cerrada', 'Violencia doméstica', 'Ana Ficticia', 'Sara Serena Ficticia', 'Del dispositivo', null, '4 min 00 s'],
    ];
    const origen = (o) => o === 'Reporte' ? `<span class="origen" style="color:var(--color-reporte)">${icono('documento', 'icono icono--sm')}Reporte</span>`
      : o === 'Acompañamiento' ? `<span class="origen" style="color:var(--color-acompanamiento)">${icono('ruta', 'icono icono--sm')}Acompañamiento</span>`
      : `<span class="etiqueta-sos">${icono('sirena')}SOS</span>`;
    const tiempos = (d, r) => !d && !r ? '<span class="tiempos-celda">—</span>' : `<span class="tiempos-celda">${d ? `<b>${d}</b>hasta la decisión` : ''}${r ? `<b>${r}</b>de respuesta` : ''}</span>`;
    let filtros = [['Desde', '17/10/2026'], ['Hasta', '18/10/2026']];

    function pintar(vacio = false) {
      document.getElementById('activos').innerHTML = filtros.map(([k, v], i) => `<span class="filtro-activo">${k}: ${v}<button type="button" data-quitar="${i}" aria-label="Quitar el filtro ${k}">${icono('error', 'icono icono--sm')}</button></span>`).join('');
      const lista = vacio ? [] : CASOS;
      document.getElementById('cuenta').textContent = `${lista.length} casos`;
      document.getElementById('filas').innerHTML = lista.length ? lista.map(([f, h, o, e, t, c, s, u, d, r]) => {
        const [tono, ic] = T[e];
        return `<tr tabindex="0"><td><span class="doble"><b>${h}</b><small>${f}</small></span></td><td>${origen(o)}</td><td><span class="chip chip--${tono}">${icono(ic)}${e}</span></td><td>${t === 'Por determinar' ? '<span class="secundario">Por determinar</span>' : t}</td>
          <td><span class="doble">${c}<small>${s === '—' ? 'Sin sereno' : s}</small></span></td><td>${u}</td><td class="num">${tiempos(d, r)}</td><td><a href="sos.html">Abrir</a></td></tr>`;
      }).join('') : `<tr><td colspan="8"><div class="vacio-tabla">${icono('lupa')}<b>Ningún caso coincide con los filtros.</b><span>Prueba con otro rango de fechas o <button class="boton boton--terciario boton--compacto" type="button" data-limpiar>limpia los filtros</button>.</span></div></td></tr>`;
    }
    document.addEventListener('click', (e) => {
      const abrir = e.target.closest('[data-abrir-filtros]');
      if (abrir) { const p = document.getElementById('panel-filtros'); p.hidden = !p.hidden; abrir.setAttribute('aria-expanded', String(!p.hidden)); }
      const q = e.target.closest('[data-quitar]'); if (q) { filtros.splice(Number(q.dataset.quitar), 1); pintar(); }
      if (e.target.closest('[data-limpiar]')) { filtros = []; document.querySelector('[data-vacio]').setAttribute('aria-pressed', 'false'); pintar(); }
      const v = e.target.closest('[data-vacio]'); if (v) { const on = v.getAttribute('aria-pressed') !== 'true'; v.setAttribute('aria-pressed', String(on)); if (on) filtros = [['Estado', 'Derivada'], ['Sereno', 'Pedro Suplente Ficticio']]; pintar(on); }
      const fila = e.target.closest('tbody tr'); if (fila && !e.target.closest('a, button')) location.href = 'sos.html';
    });
    pintar();
  </script>
</body>
</html>
