<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAD Móvil · Sereno · Prototipo CAD v2</title>
  <link rel="stylesheet" href="../../../src/Cad.Server/wwwroot/css/tokens.css" />
  <link rel="stylesheet" href="prototipo.css" />
  <link rel="stylesheet" href="movil.css" />
  <style>
    .despacho { display: grid; gap: var(--espacio-3); padding: var(--espacio-4); }
    .despacho h2 { font-size: var(--texto-xl); letter-spacing: -0.01em; }
    .lugar { display: grid; gap: 2px; padding: var(--espacio-3); border-radius: var(--radio-control); background: var(--color-superficie-hundida); }
    .lugar b { font-size: var(--texto-lg); }
    .lugar small { font-size: var(--texto-xs); color: var(--color-texto-secundario); }
    .mini-progreso { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .mini-progreso span { display: grid; gap: 4px; font-size: 12px; font-weight: var(--peso-medio); color: var(--color-texto-secundario); }
    .mini-progreso span::before { content: ""; height: 4px; border-radius: 4px; background: var(--color-borde); transition: background-color var(--duracion-lenta) var(--curva-estandar); }
    .mini-progreso .hecho { color: var(--color-texto); }
    .mini-progreso .hecho::before { background: var(--color-primario); }
    details { border-top: 1px solid var(--color-borde); padding-top: var(--espacio-3); font-size: var(--texto-sm); }
    summary { cursor: pointer; font-weight: var(--peso-medio); color: var(--color-primario); min-height: 32px; }
    .etiqueta-boton { transition: opacity var(--duracion-rapida) var(--curva-estandar); }
  </style>
</head>
<body class="escena">
  <div class="telefono" aria-label="Pantalla del teléfono">
    <div class="estado-sistema"><span>04:46</span><span>4G · 71 %</span></div>
    <section class="vista" aria-labelledby="t-sereno">
      <header class="cabecera-app">
        <div class="fila"><h1 id="t-sereno" style="font-size:var(--texto-xl)">Sara Serena</h1><button class="boton boton--sobre-marino boton--compacto" type="button" style="margin-left:auto">Salir</button></div>
        <button class="interruptor" type="button" role="switch" aria-checked="true" data-operativo><span class="interruptor__pista"></span><span><b id="t-operativo">Operativo</b><small id="d-operativo">Última posición enviada a las 04:46:00</small></span></button>
      </header>
      <div class="cuerpo" id="cuerpo"></div>
    </section>
    <div class="accion-fija" id="accion"></div>
  </div>
  <p class="leyenda-escena">Sereno: estado operativo como interruptor y despacho con una sola acción fija abajo que avanza con el caso.</p>
  <div class="controles-prototipo abajo" role="group" aria-label="Controles del prototipo"><b>Prototipo</b><button type="button" data-nuevo>Recibir despacho</button><a href="movil-ciudadano.html">Ciudadano</a><a href="index.html">Índice</a></div>

  <script type="module">
    import { icono, toast, anunciar } from './prototipo.js';
    const PASOS = [
      { boton: 'Voy en camino', apoyo: 'Avisa a la central que te desplazas.', chip: ['progreso', 'asignado', 'Asignada'] },
      { boton: 'Llegué: iniciar atención', apoyo: 'Registra la hora de llegada.', chip: ['progreso', 'camino', 'En camino'] },
      { boton: 'Cerrar el caso', apoyo: 'Indicarás la tipificación y el resultado.', chip: ['progreso', 'atencion', 'En atención'] },
    ];
    let paso = -1; let operativo = true;

    function pintar() {
      const cuerpo = document.getElementById('cuerpo'); const accion = document.getElementById('accion');
      if (!operativo) { cuerpo.innerHTML = `<div class="vacio">${icono('informacion')}<b>No estás operativo.</b>No recibirás despachos ni se enviará tu ubicación.</div>`; accion.hidden = true; return; }
      if (paso < 0) { cuerpo.innerHTML = `<div class="vacio">${icono('exito')}<b>Sin despacho asignado.</b>Te avisaremos en este teléfono, aunque la app esté cerrada.</div>`; accion.hidden = true; return; }
      if (paso === 3) {
        cuerpo.innerHTML = `<form class="superficie despacho" id="cierre"><h2>Cierre del caso</h2>
          <div class="campo"><label class="campo__etiqueta" for="tipo">Tipificación final</label><select class="campo__control" id="tipo"><option>Acoso o seguimiento en la vía pública</option><option>Violencia doméstica</option><option>Otros</option></select></div>
          <div class="campo"><label class="campo__etiqueta" for="res">Resultado de la atención</label><textarea class="campo__control" id="res">Se acompañó a la ciudadana hasta su domicilio.</textarea><span class="campo__ayuda">La ciudadana verá este texto.</span></div>
          <div class="campo"><label class="campo__etiqueta" for="notas">Notas internas (opcional)</label><textarea class="campo__control" id="notas"></textarea><span class="campo__ayuda">Solo para el personal autorizado.</span></div></form>`;
        accion.hidden = false; accion.innerHTML = `<button class="boton boton--principal boton--bloque boton-grande" type="submit" form="cierre">Confirmar cierre</button>`;
        return;
      }
      const p = PASOS[paso];
      cuerpo.innerHTML = `
        <article class="superficie despacho" aria-labelledby="t-despacho">
          <div style="display:flex;gap:8px;align-items:center"><span class="etiqueta-sos">${icono('sirena')}SOS</span><span class="chip chip--${p.chip[0]}">${icono(p.chip[1])}${p.chip[2]}</span><span class="secundario" style="margin-left:auto;font-size:var(--texto-xs)">asignado 04:46</span></div>
          <h2 id="t-despacho">Ana Ficticia</h2>
          <div class="lugar"><b>Jr. Lampa 545</b><small>Frente a la farmacia de la avenida principal · a 284 m</small></div>
          <a class="boton boton--secundario boton--bloque" href="#">${icono('ubicacion', 'icono icono--sm')}Abrir en el mapa</a>
          <div class="mini-progreso" aria-label="Avance">${['En camino', 'En atención', 'Cerrado'].map((t, i) => `<span class="${i < paso ? 'hecho' : ''}">${t}</span>`).join('')}</div>
          <details><summary>Información de la central</summary><p style="margin-top:6px">Un desconocido la sigue desde el paradero (dato ficticio). Teléfono 900 000 001.</p><p class="secundario" style="font-size:var(--texto-xs);margin-top:6px">Caso 01a14d52 · registrado 04:43:06</p></details>
        </article>`;
      accion.hidden = false;
      accion.innerHTML = `<p>${p.apoyo}</p><button class="boton boton--principal boton--bloque boton-grande" type="button" data-avanzar><span class="etiqueta-boton">${p.boton}</span></button>`;
    }
    document.addEventListener('click', (e) => {
      if (e.target.closest('[data-nuevo]')) { operativo = true; paso = 0; pintar(); navigator.vibrate?.([80, 60, 80]); anunciar('Nuevo despacho: SOS de Ana Ficticia.', 'assertive'); }
      if (e.target.closest('[data-avanzar]')) {
        const etiqueta = e.target.closest('[data-avanzar]').querySelector('.etiqueta-boton');
        etiqueta.style.opacity = 0;
        setTimeout(() => { paso++; pintar(); toast(['<strong>Central avisada:</strong> vas en camino.', '<strong>Atención iniciada</strong> a las 04:47.', ''][paso - 1] || '<strong>Completa el cierre.</strong>'); }, 160);
      }
      const op = e.target.closest('[data-operativo]');
      if (op) { operativo = !operativo; op.setAttribute('aria-checked', String(operativo)); document.getElementById('t-operativo').textContent = operativo ? 'Operativo' : 'No operativo'; document.getElementById('d-operativo').textContent = operativo ? 'Última posición enviada a las 04:46:00' : 'No se envía tu ubicación'; pintar(); }
    });
    document.addEventListener('submit', (e) => { e.preventDefault(); paso = -1; pintar(); toast('<strong>Caso cerrado.</strong> Quedas disponible para un nuevo despacho.'); });
    pintar();
  </script>
</body>
</html>
