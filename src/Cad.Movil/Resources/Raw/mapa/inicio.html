<!doctype html>
<!-- Inicio del ciudadano (ADR-08, rediseño): la ciudad como contexto y la posición del propio teléfono. Leaflet 1.9.4 incluido en
     la app (sin CDN); teselas de OpenStreetMap apagadas en azul grisáceo, como el mapa del panel. La posición la pone la app:
     esta página no lee la ubicación ni la envía a ningún sitio. -->
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>/*LEAFLET_CSS*/</style>
    <style>
        html, body, #mapa { height: 100%; margin: 0; background: #e3e9f1; }
        .leaflet-tile-pane { filter: grayscale(1) sepia(0.2) hue-rotate(180deg) saturate(1.5) brightness(1.03) contrast(0.92); }
        .leaflet-control-attribution { font: 10px/1.4 sans-serif; background: rgba(255,255,255,.75) !important; }
        /* Diseño A: el dock (SOS y acciones) ocupa la parte baja; la atribución queda justo encima. */
        .leaflet-bottom { bottom: 236px; }
    </style>
</head>
<body>
    <div id="mapa" role="img" aria-label="Mapa con tu ubicación aproximada"></div>
    <script>/*LEAFLET_JS*/</script>
    <script>
        (() => {
            const config = /*CONFIG*/;
            // Sin la marca «Leaflet» (su licencia BSD-2 no la exige en pantalla); el crédito de OpenStreetMap sí se mantiene.
            L.Control.Attribution.prototype.options.prefix = false;
            const mapa = L.map("mapa", { zoomControl: false, attributionControl: true }).setView([config.lat, config.lon], config.zoom);
            L.tileLayer(config.teselas, {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            }).addTo(mapa);

            // Movimiento (fase 3, 26/10/2026): tu punto se desliza entre lecturas y «Centrar» viaja hasta él; la primera vez, directo.
            const reducido = config.reducido || matchMedia("(prefers-reduced-motion: reduce)").matches;
            let punto = null, precision = null, deslizando = null;
            const deslizar = (marcas, destino) => {
                cancelAnimationFrame(deslizando);
                const desde = marcas[0].getLatLng(), hasta = L.latLng(destino);
                if (reducido || desde.equals(hasta)) { marcas.forEach((m) => m.setLatLng(hasta)); return; }
                const comienzo = performance.now(), duracion = 700;
                const paso = (ahora) => {
                    const t = Math.min(1, (ahora - comienzo) / duracion), k = 1 - Math.pow(1 - t, 3);
                    const aqui = [desde.lat + (hasta.lat - desde.lat) * k, desde.lng + (hasta.lng - desde.lng) * k];
                    marcas.forEach((m) => m.setLatLng(aqui));
                    if (t < 1) deslizando = requestAnimationFrame(paso);
                };
                deslizando = requestAnimationFrame(paso);
            };
            window.cad = {
                posicion: (lat, lon, metros) => {
                    const primera = !punto;
                    if (primera) {
                        precision = L.circle([lat, lon], { radius: metros, color: "#1D4ED8", weight: 1, fillColor: "#1D4ED8", fillOpacity: 0.12 }).addTo(mapa);
                        punto = L.circleMarker([lat, lon], { radius: 8, color: "#FFFFFF", weight: 3, fillColor: "#1D4ED8", fillOpacity: 1 }).addTo(mapa);
                    } else {
                        precision.setRadius(metros);
                        deslizar([punto, precision], [lat, lon]);
                    }
                    // El punto queda en la franja visible entre el saludo y el dock (70 px por debajo del centro).
                    const zoom = Math.max(mapa.getZoom(), 16);
                    const centro = mapa.unproject(mapa.project([lat, lon], zoom).subtract([0, 70]), zoom);
                    if (primera || reducido) mapa.setView(centro, zoom, { animate: false });
                    else mapa.flyTo(centro, zoom, { duration: 0.6 });
                },
            };
        })();
    </script>
</body>
</html>
