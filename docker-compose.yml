# PostgreSQL local para desarrollo y pruebas. Las credenciales se leen de .env (ignorado por Git);
# copia .env.example a .env y define tus propios valores.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-cad}
    ports:
      # Solo accesible desde este equipo.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cad-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  cad-postgres:
